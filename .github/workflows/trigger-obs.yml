name: Trigger ROCm10 OBS services
on:
  push:
    branches: [rocm10]
  workflow_dispatch:        # 手动触发入口，测试和补触发用
    inputs:
      package:
        description: "Force-trigger this package (skip diff)"
        required: false
        default: ""

jobs:
  trigger:
    if: github.ref == 'refs/heads/rocm10'
    runs-on: ubuntu-latest
    env:
      OBS_PROJECT: home:Sakura286:ROCm10
      TMPDIR: ${{ github.workspace }}/tmp/rocm10-ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # diff 需要完整历史

      - name: Determine changed packages
        env:
          PACKAGE: ${{ inputs.package }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          mkdir -p "$TMPDIR"
          if [ -n "$PACKAGE" ]; then
            if [[ ! "$PACKAGE" =~ ^[A-Za-z0-9_][A-Za-z0-9_.+-]*$ ]] || [ ! -d "SPECS/$PACKAGE" ]; then
              echo "Invalid or missing package: $PACKAGE" >&2
              exit 1
            fi
            printf '%s\n' "$PACKAGE" > "$TMPDIR/pkgs"
          else
            case "$BEFORE" in
              ""|00000000*) range="$AFTER~1..$AFTER" ;;  # 首次接入的包另行指定 package 触发
              *)            range="$BEFORE..$AFTER" ;;
            esac
            git diff --name-only "$range" |
              awk -F/ '$1=="SPECS" && $2 {print $2}' | sort -u > "$TMPDIR/pkgs"
          fi
          echo "OBS project: $OBS_PROJECT"
          echo "Packages to trigger:"; cat "$TMPDIR/pkgs"

      - name: Trigger OBS
        env:
          OBS_TOKEN: ${{ secrets.OBS_TRIGGER_TOKEN }}
        run: |
          rc=0
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            code=$(curl -sS -o "$TMPDIR/resp" -w "%{http_code}" -X POST \
              -H "Authorization: Token $OBS_TOKEN" \
              "https://pickaxe.oerv.ac.cn/trigger/runservice?project=${OBS_PROJECT}&package=$pkg")
            echo "== $pkg -> HTTP $code"; cat "$TMPDIR/resp"; echo
            [ "$code" = "200" ] || rc=1
          done < "$TMPDIR/pkgs"
          exit $rc
